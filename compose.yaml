services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_started
    ports:
      - "127.0.0.1:${NGINX_PORT:-4400}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/api/ping | grep -q 'ok'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  composer_vendor:
